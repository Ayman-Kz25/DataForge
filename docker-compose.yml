services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/dataforge
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      - mongo
      - python-service

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHON_ENV=development

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
